name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Offline tests
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Smoke test the binary
        shell: bash
        run: |
          bin=target/release/so-trust
          "$bin" --version
          "$bin" --help | head -3
          set +e
          "$bin" --bogus 2>/dev/null; test $? -eq 2
          "$bin" 2>/dev/null; test $? -eq 2

  # Calls the live Stack Exchange API. Runner IPs share the anonymous quota, so it only runs when started by hand.
  live:
    name: live API tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -- --ignored
