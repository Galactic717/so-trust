[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "so-trust"
version = "0.2.0"
description = "Rate how far a Stack Overflow answer can be trusted today: STALE / CHECK / OK verdicts via the public Stack Exchange API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/Galactic717/so-trust"

[project.scripts]
so-trust = "so_trust:main"

[tool.setuptools]
py-modules = ["so_trust"]
